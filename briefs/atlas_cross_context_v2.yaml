# Cross-context coherence brief v2 — larger "Project Atlas" (four-subsystem seam).
#
# Phase 2b (brief): same six deterministic families and the same checker as v1,
# but a larger system description — four subsystems instead of two, more
# components and sensors. The question under test: does the prose seam degrade
# BELOW its v1 floor (1–2 cells) as the design grows, in proportion to size?
# Checker version unchanged — the families are parameterised over the whole
# deliverable, so v1 and v2 runs remain measured by the same oracle.

id: atlas_cross_context_v2
title: Propulsion ↔ energy/thermal ↔ chassis ↔ control integration for Project Atlas

description: >
  Jane owns PROPULSION and CHASSIS (locomotion on loose sand, the hybrid
  wheel-leg concept, the vehicle structure). Ahmed owns ENERGY & THERMAL and
  CONTROL SOFTWARE (battery pack, motor controller, thermal management, power
  distribution, the control firmware, and safety monitoring). The four
  subsystems meet at the motor-controller ↔ battery power interface and at the
  control-firmware ↔ propulsion interface. Contexts are isolated; they can
  only exchange a boundary artifact. The integrated design must satisfy all
  constraints below, in both the happy path and the named edge cases.

vocabulary: tier01/vocabulary.yaml

roles:
  jane:
    scope: >
      the terrain-capability need, the 350 kg mass constraint, the propulsion
      function (hybrid wheel-leg), the chassis structure, and your concept
      decisions with their rationale
    excluded: >
      The battery pack, motor controller, thermal management, power
      distribution, control software and safety monitoring
  ahmed:
    scope: >
      the battery pack, the motor controller (with the EXACT tag
      `sensor-critical` and its sensors attribute), thermal management, the
      power-bus INTERFACE cell, the control firmware, the safety monitoring
      cell, and the failsafe constraint

constraints:
  - id: mass_budget
    kind: mass
    rule: >
      Total vehicle mass must not exceed 350 kg. Every component in the
      integrated design must declare `mass_kg`, and the sum over all
      components must be <= 350.
    fields: [mass_kg]
    bound_lte: 350

  - id: interface_completeness
    kind: interface
    rule: >
      The power interface between propulsion and energy subsystems must
      declare voltage (V), peak current (A), and thermal duty (max W to
      dissipate at the interface). An interface cell is complete iff all
      three are present and positive.
    target_type: interface
    required_fields: [voltage_v, peak_current_a, thermal_duty_w]

  - id: redundancy
    kind: safety
    rule: >
      Every sensor in the propulsion loop that is single-point-of-failure
      critical must be covered by either a redundant channel or a failsafe
      trigger. Coverage must be declared per sensor; undeclared sensors are
      violations. "COTS-X has no redundancy" is a fact, not a coverage.
    target_tag: sensor-critical

  - id: term_consistency
    kind: vocabulary
    rule: >
      Commitments crossing the seam must use the controlled terms of the
      shared vocabulary. A term used by one side and echoed by the other
      must denote the same mechanism (checked by a deterministic alias
      table). Undefined aliases are violations.
    alias_table: tier01/examples/atlas/terms.yaml

  - id: no_dangling_assumptions
    kind: assumptions
    rule: >
      Every assumption recorded by one side must be acknowledged or
      contested by the other side in the integrated design. Unacknowledged
      assumptions are violations.

  - id: typed_graph_validity
    kind: structure
    rule: >
      The integrated deliverable is a typed ecosystem (cells + relations).
      It must pass the deterministic tier01 oracle: schema-valid
      frontmatter, closed relation vocabulary, domain/range compliance,
      no dangling references.

edge_cases:
  - id: ec_thermal_peak
    description: >
      Peak sand operation drives motor controller temperature above its
      continuous rating; the thermal duty declared at the interface must
      reflect peak, not nominal.
  - id: ec_sensor_loss
    description: >
      A motor-controller telemetry sensor fails during a climb; the
      integrated design must reach limp-home without crossing the
      interface's peak current limit.
  - id: ec_battery_depleted
    description: >
      Battery at 10% state of charge on loose sand; propulsion must
      degrade gracefully without exceeding the mass or interface bounds.
  - id: ec_chassis_coupling
    description: >
      The chassis stiffness target interacts with the propulsion mass
      budget: a stiffer frame costs mass, and the trade must be recorded
      as a decision grounded in both constraints.
